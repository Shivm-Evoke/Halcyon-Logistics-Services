# Runs on every pull request: unit tests plus a Docker build, so broken code is caught before merging to main.
name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server unit tests
        working-directory: server
        run: |
          npm ci
          npm test
      - name: Docker build (not pushed)
        run: docker build -t halcyon:ci .
